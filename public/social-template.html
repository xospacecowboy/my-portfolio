<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Social Card Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .container {
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, #ffffff 0%, #cccccc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .handle {
            font-size: 32px;
            color: #666;
            margin-bottom: 30px;
        }
        .description {
            font-size: 24px;
            color: #999;
            max-width: 800px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stephen Beardslee</h1>
        <div class="handle">@oxytocins</div>
        <div class="description">
            Creative Strategist & Social Media Leader
        </div>
    </div>
</body>
</html>
